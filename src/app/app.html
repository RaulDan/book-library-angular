<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <strong>BookBase</strong>
    </div>

    <nav class="menu">
      <button type="button" [class.active]="isActive('discover')" (click)="setActiveSection('discover')">
        Discover
      </button>
      <button type="button" [class.active]="isActive('category')" (click)="setActiveSection('category')">
        Category
      </button>
      <button type="button" [class.active]="isActive('favourite')" (click)="setActiveSection('favourite')">
        Favourite
      </button>
    </nav>
  </aside>

  <main class="content">
    @if (activeSection === 'discover') {
      <app-discover-view />
    } @else if (activeSection === 'category') {
      <app-categories-view />
    } @else {
      <app-favourites-view />
    }
  </main>
</div>
