<section class="view-head">
  <div>
    <h1>Discover Books</h1>
    <p>Explore, edit and track your reading collection.</p>
  </div>
  <button type="button" class="primary" (click)="openCreateDialog()">Add book</button>
</section>

@if (booksApi.error()) {
  <p class="error">{{ booksApi.error() }}</p>
}

@if (booksApi.loading()) {
  <p class="empty">Loading books...</p>
} @else if (books.length === 0) {
  <p class="empty">No books yet. Add your first one.</p>
} @else {
  <section class="book-grid">
    @for (book of books; track book.id) {
      <app-book-card
        [book]="book"
        (edit)="openEditDialog($event)"
        (toggleFavorite)="toggleFavorite($event)"
        (remove)="deleteBook($event)"
      />
    }
  </section>
}

<app-book-dialog
  [isOpen]="isDialogOpen"
  [mode]="dialogMode"
  [book]="selectedBook"
  [categories]="categories"
  [errorMessage]="dialogError"
  [isSaving]="isSaving"
  (close)="closeDialog()"
  (save)="saveBook($event)"
/>
